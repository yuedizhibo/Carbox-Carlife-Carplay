[package]
name = "cp-native"
description = "Headless Zero2W real-CarPlay sidecar: AP launcher, MFi guard, status/diagnostics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "cp-native"
path = "src/main.rs"

[dependencies]
cp-harness = { path = "../cp-harness" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
